name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5

      - name: Instalar Tesseract (OCR)
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Instalar Ghostscript
        shell: pwsh
        run: |
          choco install ghostscript -y --no-progress
          $bin = (Get-ChildItem "C:\Program Files\gs\gs*\bin" -Directory:$false | Select-Object -Last 1).FullName
          if (-not $bin) { $bin = (Get-ChildItem "C:\Program Files\gs\*\bin" | Select-Object -Last 1).FullName }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Instalar Node.js (pruebas del plugin de Illustrator)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: uv sync

      - name: Pruebas unitarias
        run: uv run pytest -q

      - name: Banco de pruebas (casos sintéticos)
        run: uv run python -m bench.run --sinteticos --ci --workers 2 --etiqueta "CI"

      - name: Bancos de separacion de imagen, vectorizador y trapping
        run: |
          uv run python -m bench.separation.run --ci
          uv run python -m bench.vector.run --casos 12 --ci
          uv run python -m bench.trapping.run --ci

      - name: Plugin de Illustrator (empaquetado sin firma; la firma la hace el usuario con su certificado)
        run: uv run python plugin/tools/build_zxp.py --sin-firma

      - name: Guardar reporte del banco de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-reporte
          path: datos_locales/bench_resultados/
          if-no-files-found: ignore
