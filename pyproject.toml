[project]
name = "faverview"
version = "2.0.0"
description = "Compara el arte del cliente con tu diseño en PDF y marca las diferencias."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "pillow>=10.3",
    "opencv-python-headless>=4.9",
    "scikit-image>=0.23",
    "numpy>=1.26",
    "pytesseract>=0.3.10",
    "rapidfuzz>=3.9",
    "pyspellchecker>=0.8.1",
    "imagehash>=4.3",
    "scipy>=1.11",
    "spylls>=0.1.7",
]

[project.scripts]
faverview = "app.launcher:main"
faverview-aprender = "app.learning.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
